<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潮间带生态修复</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #eaf3f1; color: #1c2b2c; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dbd8; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #237070; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #617b78; }
    .app { display: grid; grid-template-columns: 290px 1fr 300px; gap: 16px; padding: 16px; }
    .panel, .stat { background: #fff; border: 1px solid #c9dbd8; border-radius: 8px; padding: 14px; }
    .tools { display: grid; gap: 8px; }
    .tools button.active { background: #c08d2d; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat strong { display: block; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; max-width: 900px; margin: 0 auto; }
    .cell { aspect-ratio: 1; border: 1px solid #9fbfbb; border-radius: 5px; display: grid; place-items: center; font-weight: 900; cursor: pointer; background: #9ed1d0; position: relative; overflow: hidden; }
    .cell.polluted::after { content: ""; position: absolute; inset: 0; background: rgba(104,82,58,.45); }
    .cell.oyster { background: #d4d4c8; }
    .cell.grass { background: #6eb77a; }
    .cell.pile { background: #b89568; }
    .cell span { position: relative; z-index: 1; }
    .log { height: 260px; overflow: auto; display: flex; flex-direction: column-reverse; gap: 8px; }
    .entry { background: #f3f8f7; border-left: 4px solid #237070; border-radius: 6px; padding: 8px; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,40,40,.42); }
    .modal { width: min(430px, calc(100% - 28px)); background: #fff; border: 1px solid #c9dbd8; border-radius: 8px; padding: 22px; }
    .scene-modal { width: min(720px, calc(100% - 28px)); }
    .scene-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
    .scene-card { border: 2px solid #c9dbd8; border-radius: 8px; padding: 16px; cursor: pointer; background: #f3f8f7; transition: all .15s; }
    .scene-card:hover { border-color: #237070; transform: translateY(-2px); }
    .scene-card.selected { border-color: #c08d2d; background: #fdf6e3; }
    .scene-card h3 { margin: 0 0 6px; font-size: 18px; }
    .scene-card .desc { font-size: 13px; color: #4a5f5d; margin-bottom: 10px; min-height: 52px; }
    .scene-card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .scene-card .tag { font-size: 11px; background: #d9e7e5; color: #237070; padding: 3px 8px; border-radius: 10px; }
    .scene-info { font-size: 13px; color: #4a5f5d; margin-left: 10px; }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .hidden { display: none; }
    .editor-modal { width: min(960px, calc(100% - 28px)); }
    .editor-container { display: grid; grid-template-columns: 200px 1fr 240px; gap: 16px; }
    .editor-tools { display: grid; gap: 8px; align-content: start; }
    .editor-tools button { text-align: left; }
    .editor-tools button.active { background: #c08d2d; }
    .editor-params { display: grid; gap: 12px; align-content: start; }
    .editor-params label { display: block; font-size: 13px; color: #4a5f5d; margin-bottom: 4px; }
    .editor-params input { width: 100%; padding: 8px; border: 1px solid #c9dbd8; border-radius: 6px; font-size: 14px; }
    .editor-params .param-help { font-size: 11px; color: #8a9a98; margin-top: 2px; }
    .editor-preview { margin-top: 12px; padding: 12px; background: #f3f8f7; border-radius: 6px; font-size: 12px; }
    .editor-preview h4 { margin: 0 0 8px; font-size: 14px; }
    .editor-preview .preview-item { display: flex; justify-content: space-between; padding: 3px 0; }
    .error-tip { color: #c0392b; font-size: 12px; margin-top: 4px; min-height: 18px; }
    .error-tip.show { padding: 8px; background: #fdecea; border-radius: 4px; border-left: 3px solid #c0392b; }
    .editor-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .editor-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
    .editor-grid .cell { cursor: crosshair; }
    .editor-grid .cell.preview-pol::after { content: ""; position: absolute; inset: 0; background: rgba(196, 30, 30, 0.25); }
    .editor-grid .cell.preview-obs::before { content: "?"; position: absolute; z-index: 2; color: rgba(0,0,0,0.3); font-size: 16px; }
    .sandbox-tag { background: #c08d2d !important; color: #fff !important; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } .scene-list { grid-template-columns: 1fr; } .header-right { margin-top: 10px; } .editor-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>潮间带生态修复</h1>
      <div>放置设施，控制污染，撑过潮汐周期。<span class="scene-info" id="sceneInfo"></span></div>
    </div>
    <div class="header-right">
      <button id="switchSceneBtn" class="secondary">切换场景</button>
      <button id="restartBtn">新开一局</button>
    </div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>设施</h2>
      <div class="tools">
        <button data-tool="oyster" class="active">牡蛎礁 - 12预算</button>
        <button data-tool="grass">海草床 - 10预算</button>
        <button data-tool="pile">围护桩 - 8预算</button>
        <button data-tool="erase" class="secondary">移除设施</button>
      </div>
      <p>牡蛎礁提升水质，海草床提升多样性，围护桩减缓污染扩散。</p>
      <button id="nextBtn">推进潮汐</button>
    </aside>
    <section class="panel">
      <div class="grid" id="grid"></div>
    </section>
    <aside class="panel">
      <h2>生态指标</h2>
      <div class="stats">
        <div class="stat"><span>回合</span><strong id="turnText">1 / 10</strong></div>
        <div class="stat"><span>预算</span><strong id="budgetText">120</strong></div>
        <div class="stat"><span>水质</span><strong id="waterText">50</strong></div>
        <div class="stat"><span>幼体</span><strong id="larvaeText">20</strong></div>
        <div class="stat"><span>多样性</span><strong id="bioText">20</strong></div>
        <div class="stat"><span>污染</span><strong id="pollutionText">0</strong></div>
      </div>
      <h2>日志</h2>
      <div class="log" id="log"></div>
    </aside>
  </main>
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="againBtn">再修复一次</button>
    </div>
  </div>
  <div class="overlay" id="sceneOverlay">
    <div class="modal scene-modal">
      <h2>选择修复场景</h2>
      <p>不同场景拥有不同的初始条件、挑战难度和修复目标。</p>
      <div class="scene-list" id="sceneList"></div>
      <div style="text-align:right;">
        <button id="startSceneBtn">开始修复</button>
      </div>
    </div>
  </div>
  <div class="overlay hidden" id="editorOverlay">
    <div class="modal editor-modal">
      <h2>沙盒编辑器</h2>
      <p>自定义你的修复区地图和游戏参数。配置完成后保存并开始模拟。</p>
      <div class="editor-container">
        <div class="editor-tools" id="editorTools">
          <button data-edit="pollute" class="active">设置污染格</button>
          <button data-edit="unpollute">清除污染格</button>
          <button data-edit="oyster">初始：牡蛎礁 - 12</button>
          <button data-edit="grass">初始：海草床 - 10</button>
          <button data-edit="pile">初始：围护桩 - 8</button>
          <button data-edit="erase" class="secondary">清除设施</button>
          <button data-edit="clearAll" class="secondary">清空全部</button>
        </div>
        <div>
          <div class="editor-grid" id="editorGrid"></div>
        </div>
        <div class="editor-params">
          <div>
            <label>初始预算</label>
            <input type="number" id="paramBudget" value="120" min="0" step="10">
            <div class="param-help">建议范围：50 - 300</div>
          </div>
          <div>
            <label>回合上限</label>
            <input type="number" id="paramTurns" value="10" min="1" max="30">
            <div class="param-help">建议范围：5 - 20</div>
          </div>
          <div>
            <label>风暴概率</label>
            <input type="number" id="paramStorm" value="0.20" min="0" max="1" step="0.05">
            <div class="param-help">范围：0 - 1（如 0.2 表示20%）</div>
          </div>
          <div>
            <label>目标评分</label>
            <input type="number" id="paramGoal" value="50" min="0" step="5">
            <div class="param-help">达成此评分即修复成功</div>
          </div>
          <div class="editor-preview">
            <h4>配置预览</h4>
            <div class="preview-item"><span>污染格数</span><span id="previewPollution">0</span></div>
            <div class="preview-item"><span>可修复区域</span><span id="previewRepairable">96</span></div>
            <div class="preview-item"><span>初始设施</span><span id="previewFacilities">0</span></div>
            <div class="preview-item"><span>初始设施花费</span><span id="previewCost">0</span></div>
          </div>
          <div class="error-tip" id="editorError"></div>
        </div>
      </div>
      <div class="editor-actions">
        <button id="editorCancelBtn" class="secondary">取消</button>
        <button id="editorSaveBtn">保存并开始</button>
      </div>
    </div>
  </div>
  <script>
    const gridEl = document.querySelector("#grid");
    const logEl = document.querySelector("#log");
    const overlay = document.querySelector("#overlay");
    const sceneOverlay = document.querySelector("#sceneOverlay");
    const sceneListEl = document.querySelector("#sceneList");
    const sceneInfoEl = document.querySelector("#sceneInfo");
    const resultTitle = document.querySelector("#resultTitle");
    const resultText = document.querySelector("#resultText");
    const costs = { oyster: 12, grass: 10, pile: 8, erase: 0 };
    const icons = { oyster: "礁", grass: "草", pile: "桩", empty: "" };
    const DEFAULT_SCENE_ID = "beginner";
    const SANDBOX_EDITOR_ID = "sandbox-editor";

    const scenes = {
      beginner: {
        id: "beginner",
        name: "入门滩涂",
        desc: "平缓开阔的泥质滩涂，污染较轻，适合新手熟悉修复流程。",
        budget: 150,
        water: 55,
        larvae: 25,
        bio: 25,
        turns: 10,
        stormChance: 0.18,
        pollutionIndices: [11, 23, 47, 71],
        goalScore: 60,
        goalDesc: "生态评分 ≥ 60",
        tags: ["低难度", "预算充裕", "污染较少"],
        winText: "滩涂生态恢复喜人！招潮蟹在泥穴间穿梭，白鹭翩然而至，这片湿地重新焕发了生机。",
        loseText: "滩涂生态有所改善，但仍有提升空间。继续守护这片湿地，让更多生物回归。"
      },
      polluted: {
        id: "polluted",
        name: "污染湾口",
        desc: "毗邻排污口的淤塞湾口，污染密集且扩散迅速，预算紧张。",
        budget: 100,
        water: 35,
        larvae: 12,
        bio: 12,
        turns: 12,
        stormChance: 0.22,
        pollutionIndices: [2, 5, 14, 27, 38, 45, 53, 62, 78, 89],
        goalScore: 55,
        goalPollutionMax: 18,
        goalDesc: "评分 ≥ 55 且污染 ≤ 18格",
        tags: ["高难度", "预算紧张", "污染密集"],
        winText: "湾口水质显著改善！排污口治理成效显现，曾经浑浊的海水重现清澈，鱼群开始回游。",
        loseText: "污染压力依然沉重，治理成效有限。需要更科学的设施布局和更大力度的投入。"
      },
      storm: {
        id: "storm",
        name: "风暴前线",
        desc: "直面外海的风暴潮通道，设施易被损毁，考验快速恢复能力。",
        budget: 130,
        water: 48,
        larvae: 20,
        bio: 18,
        turns: 10,
        stormChance: 0.45,
        pollutionIndices: [7, 19, 35, 50, 68, 82],
        goalScore: 50,
        goalMinStats: 35,
        goalDesc: "评分 ≥ 50 且所有指标 ≥ 35",
        tags: ["中难度", "风暴频发", "设施易损"],
        winText: "经受住风暴考验！潮间带防线固若金汤，即使风暴潮来袭，生态系统依然稳定运转。",
        loseText: "风暴破坏超出预期，设施损失严重。需要更多围护桩构建可靠的防波防线。"
      }
    };

    let currentSceneId = DEFAULT_SCENE_ID;
    let selectedSceneId = DEFAULT_SCENE_ID;
    let tool = "oyster";
    let game;

    const editorOverlay = document.querySelector("#editorOverlay");
    const editorGridEl = document.querySelector("#editorGrid");
    const editorToolsEl = document.querySelector("#editorTools");
    const editorErrorEl = document.querySelector("#editorError");

    let editorState = {
      editTool: "pollute",
      cells: Array.from({ length: 96 }, () => ({ type: "empty", polluted: false })),
      params: {
        budget: 120,
        turns: 10,
        stormChance: 0.20,
        goalScore: 50
      }
    };

    function renderSceneList() {
      const regularScenes = Object.values(scenes).map(s => `
        <div class="scene-card ${s.id === selectedSceneId ? 'selected' : ''}" data-id="${s.id}">
          <h3>${s.name}</h3>
          <div class="desc">${s.desc}</div>
          <div class="tags">
            ${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
          <div style="margin-top:10px; font-size:12px; color:#4a5f5d;">
            预算：${s.budget} | 回合：${s.turns} | 目标：${s.goalDesc}
          </div>
        </div>
      `).join('');

      const sandboxCard = `
        <div class="scene-card ${selectedSceneId === SANDBOX_EDITOR_ID ? 'selected' : ''}" data-id="${SANDBOX_EDITOR_ID}">
          <h3>沙盒编辑器</h3>
          <div class="desc">自由配置污染格、初始设施和游戏参数，打造你的专属修复挑战。</div>
          <div class="tags">
            <span class="tag sandbox-tag">自定义</span>
            <span class="tag">自由配置</span>
            <span class="tag">创意挑战</span>
          </div>
          <div style="margin-top:10px; font-size:12px; color:#4a5f5d;">
            点击进入编辑器配置地图和参数
          </div>
        </div>
      `;

      sceneListEl.innerHTML = regularScenes + sandboxCard;
      sceneListEl.querySelectorAll('.scene-card').forEach(card => {
        card.onclick = () => {
          selectedSceneId = card.dataset.id;
          renderSceneList();
        };
      });
    }

    function showSceneSelect() {
      selectedSceneId = currentSceneId;
      renderSceneList();
      sceneOverlay.classList.remove('hidden');
      overlay.classList.add('hidden');
    }

    function startGameWithScene(sceneId) {
      if (sceneId === SANDBOX_EDITOR_ID) {
        openSandboxEditor();
        return;
      }
      currentSceneId = sceneId;
      sceneOverlay.classList.add('hidden');
      sceneInfoEl.textContent = `当前场景：${scenes[currentSceneId].name}`;
      fresh();
    }

    function openSandboxEditor() {
      sceneOverlay.classList.add('hidden');
      editorOverlay.classList.remove('hidden');
      resetEditorState();
      renderEditor();
      bindEditorEvents();
    }

    function closeSandboxEditor() {
      editorOverlay.classList.add('hidden');
      sceneOverlay.classList.remove('hidden');
      selectedSceneId = currentSceneId;
      renderSceneList();
    }

    function resetEditorState() {
      editorState = {
        editTool: "pollute",
        cells: Array.from({ length: 96 }, () => ({ type: "empty", polluted: false })),
        params: {
          budget: 120,
          turns: 10,
          stormChance: 0.20,
          goalScore: 50
        }
      };
      document.querySelector("#paramBudget").value = 120;
      document.querySelector("#paramTurns").value = 10;
      document.querySelector("#paramStorm").value = 0.20;
      document.querySelector("#paramGoal").value = 50;
      editorErrorEl.textContent = "";
      editorErrorEl.classList.remove("show");
    }

    function renderEditor() {
      editorGridEl.innerHTML = editorState.cells.map((cell, i) => {
        let classes = "cell " + cell.type;
        if (cell.polluted) classes += " polluted";
        return `<div class="${classes}" data-i="${i}"><span>${icons[cell.type]}</span></div>`;
      }).join("");

      editorGridEl.querySelectorAll(".cell").forEach(cell => {
        cell.onclick = () => handleEditorClick(Number(cell.dataset.i));
        cell.onmouseenter = () => handleEditorHover(Number(cell.dataset.i), true);
        cell.onmouseleave = () => handleEditorHover(Number(cell.dataset.i), false);
      });

      editorToolsEl.querySelectorAll("[data-edit]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.edit === editorState.editTool);
      });

      updateEditorPreview();
    }

    function handleEditorClick(i) {
      const cell = editorState.cells[i];
      const tool = editorState.editTool;

      if (tool === "pollute") {
        cell.polluted = true;
      } else if (tool === "unpollute") {
        cell.polluted = false;
      } else if (tool === "erase") {
        cell.type = "empty";
      } else if (tool === "clearAll") {
        resetEditorState();
      } else if (["oyster", "grass", "pile"].includes(tool)) {
        if (cell.type === "empty") {
          cell.type = tool;
        }
      }

      renderEditor();
    }

    function handleEditorHover(i, enter) {
      const cell = editorGridEl.querySelector(`[data-i="${i}"]`);
      if (!cell) return;

      if (enter) {
        if (editorState.editTool === "pollute") {
          cell.classList.add("preview-pol");
        } else if (["oyster", "grass", "pile"].includes(editorState.editTool)) {
          cell.classList.add("preview-obs");
        }
      } else {
        cell.classList.remove("preview-pol", "preview-obs");
      }
    }

    function updateEditorPreview() {
      const pollutionCount = editorState.cells.filter(c => c.polluted).length;
      const repairableCount = editorState.cells.filter(c => !c.polluted).length;
      const facilities = editorState.cells.filter(c => c.type !== "empty");
      const facilityCount = facilities.length;
      const facilityCost = facilities.reduce((sum, c) => sum + costs[c.type], 0);

      document.querySelector("#previewPollution").textContent = pollutionCount;
      document.querySelector("#previewRepairable").textContent = repairableCount;
      document.querySelector("#previewFacilities").textContent = facilityCount;
      document.querySelector("#previewCost").textContent = facilityCost;
    }

    function validateEditorConfig() {
      const params = editorState.params;
      const cells = editorState.cells;
      const errors = [];

      const repairableCount = cells.filter(c => !c.polluted).length;
      if (repairableCount === 0) {
        errors.push("没有可修复区域：所有格子都被设置为污染，请至少保留一个非污染格。");
      }

      if (params.budget < 0) {
        errors.push("初始预算不能为负数。");
      }

      if (params.budget === 0) {
        errors.push("初始预算为0，无法放置任何设施。");
      }

      if (params.turns < 1 || params.turns > 30) {
        errors.push("回合数超出合理范围：请设置1-30回合。");
      }

      if (params.stormChance < 0 || params.stormChance > 1) {
        errors.push("风暴概率必须在0到1之间。");
      }

      if (params.goalScore < 0) {
        errors.push("目标评分不能为负数。");
      }

      const facilityCost = cells.filter(c => c.type !== "empty").reduce((sum, c) => sum + costs[c.type], 0);
      if (facilityCost > params.budget) {
        errors.push(`初始设施花费(${facilityCost})超过初始预算(${params.budget})。`);
      }

      return errors;
    }

    function showEditorError(message) {
      editorErrorEl.textContent = message;
      editorErrorEl.classList.add("show");
    }

    function clearEditorError() {
      editorErrorEl.textContent = "";
      editorErrorEl.classList.remove("show");
    }

    function saveAndStartSandbox() {
      editorState.params.budget = Number(document.querySelector("#paramBudget").value);
      editorState.params.turns = Number(document.querySelector("#paramTurns").value);
      editorState.params.stormChance = Number(document.querySelector("#paramStorm").value);
      editorState.params.goalScore = Number(document.querySelector("#paramGoal").value);

      const errors = validateEditorConfig();
      if (errors.length > 0) {
        showEditorError(errors.join("\n"));
        return;
      }

      clearEditorError();

      const pollutionIndices = editorState.cells
        .map((c, i) => c.polluted ? i : -1)
        .filter(i => i >= 0);

      const initialFacilities = editorState.cells.filter(c => c.type !== "empty");
      const facilityCost = initialFacilities.reduce((sum, c) => sum + costs[c.type], 0);

      const sandboxScene = {
        id: "sandbox",
        name: "自定义沙盒",
        desc: "玩家自定义配置的修复挑战场景。",
        budget: editorState.params.budget - facilityCost,
        water: 50,
        larvae: 20,
        bio: 20,
        turns: editorState.params.turns,
        stormChance: editorState.params.stormChance,
        pollutionIndices: pollutionIndices,
        goalScore: editorState.params.goalScore,
        goalDesc: `生态评分 ≥ ${editorState.params.goalScore}`,
        tags: ["自定义", "沙盒"],
        winText: "自定义挑战完成！你成功修复了这片潮间带。",
        loseText: "自定义挑战失败，继续调整策略尝试吧！",
        initialCells: editorState.cells.map(c => ({ type: c.type, polluted: c.polluted }))
      };

      scenes.sandbox = sandboxScene;
      currentSceneId = "sandbox";
      editorOverlay.classList.add('hidden');
      sceneInfoEl.textContent = `当前场景：自定义沙盒`;
      freshSandbox();
    }

    function freshSandbox() {
      const s = scenes[currentSceneId];
      game = {
        turn: 1, budget: s.budget, water: s.water, larvae: s.larvae, bio: s.bio, ended: false,
        cells: s.initialCells.map(c => ({ ...c })),
        log: ["【自定义沙盒】第1潮，退潮露出修复区。目标：" + s.goalDesc]
      };
      overlay.classList.add("hidden");
      render();
    }

    function bindEditorEvents() {
      editorToolsEl.querySelectorAll("[data-edit]").forEach(btn => {
        btn.onclick = () => {
          editorState.editTool = btn.dataset.edit;
          if (editorState.editTool === "clearAll") {
            resetEditorState();
            renderEditor();
          } else {
            renderEditor();
          }
        };
      });

      ["paramBudget", "paramTurns", "paramStorm", "paramGoal"].forEach(id => {
        document.querySelector("#" + id).oninput = () => {
          editorState.params.budget = Number(document.querySelector("#paramBudget").value);
          editorState.params.turns = Number(document.querySelector("#paramTurns").value);
          editorState.params.stormChance = Number(document.querySelector("#paramStorm").value);
          editorState.params.goalScore = Number(document.querySelector("#paramGoal").value);
          updateEditorPreview();
          clearEditorError();
        };
      });
    }

    function fresh() {
      const s = scenes[currentSceneId];
      let cells;
      if (currentSceneId === "sandbox" && s.initialCells) {
        cells = s.initialCells.map(c => ({ ...c }));
      } else {
        cells = Array.from({ length: 96 }, (_, i) => ({ type: "empty", polluted: s.pollutionIndices.includes(i) }));
      }
      game = {
        turn: 1, budget: s.budget, water: s.water, larvae: s.larvae, bio: s.bio, ended: false,
        cells: cells,
        log: ["【" + s.name + "】第1潮，退潮露出修复区。目标：" + s.goalDesc]
      };
      overlay.classList.add("hidden");
      render();
    }

    function render() {
      gridEl.innerHTML = game.cells.map((cell, i) => '<div class="cell '+cell.type+(cell.polluted?' polluted':'')+'" data-i="'+i+'"><span>'+icons[cell.type]+'</span></div>').join("");
      document.querySelectorAll(".cell").forEach(cell => cell.onclick = () => place(Number(cell.dataset.i)));
      document.querySelector("#turnText").textContent = game.turn + " / " + scenes[currentSceneId].turns;
      document.querySelector("#budgetText").textContent = game.budget;
      document.querySelector("#waterText").textContent = Math.round(game.water);
      document.querySelector("#larvaeText").textContent = Math.round(game.larvae);
      document.querySelector("#bioText").textContent = Math.round(game.bio);
      document.querySelector("#pollutionText").textContent = game.cells.filter(c => c.polluted).length;
      logEl.innerHTML = game.log.map(item => '<div class="entry">'+item+'</div>').join("");
      document.querySelectorAll("[data-tool]").forEach(btn => btn.classList.toggle("active", btn.dataset.tool === tool));
    }

    function place(i) {
      if (game.ended) return;
      const cell = game.cells[i];
      if (tool === "erase") {
        if (cell.type !== "empty") { cell.type = "empty"; game.log.unshift("移除了一处设施。"); }
        render(); return;
      }
      if (cell.type !== "empty" || game.budget < costs[tool]) return;
      cell.type = tool;
      game.budget -= costs[tool];
      game.log.unshift("放置" + (tool === "oyster" ? "牡蛎礁" : tool === "grass" ? "海草床" : "围护桩") + "。");
      render();
    }

    function neighbors(i) {
      const x = i % 12, y = Math.floor(i / 12);
      return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b]) => a>=0 && a<12 && b>=0 && b<8).map(([a,b]) => b*12+a);
    }

    function nextTurn() {
      if (game.ended) return;
      const s = scenes[currentSceneId];
      const oysters = game.cells.filter(c => c.type === "oyster").length;
      const grass = game.cells.filter(c => c.type === "grass").length;
      const piles = game.cells.filter(c => c.type === "pile").length;
      const pollution = game.cells.filter(c => c.polluted).length;
      game.water += oysters * 2.1 - pollution * .8;
      game.larvae += oysters * 1.2 + grass * .6 - pollution * .4;
      game.bio += grass * 1.8 + oysters * .4 - pollution * .5;
      game.budget += 8;
      spreadPollution(piles);
      if (Math.random() < s.stormChance) storm();
      game.water = clamp(game.water); game.larvae = clamp(game.larvae); game.bio = clamp(game.bio);
      game.log.unshift("第"+game.turn+"潮结束：牡蛎礁"+oysters+"处，海草床"+grass+"处，围护桩"+piles+"处。");
      if (game.turn >= s.turns) return finish();
      game.turn += 1;
      render();
    }

    function spreadPollution(piles) {
      const newPolluted = new Set();
      game.cells.forEach((cell, i) => {
        if (!cell.polluted) return;
        for (const n of neighbors(i)) {
          if (game.cells[n].type === "pile") continue;
          if (Math.random() < Math.max(.08, .28 - piles * .015)) newPolluted.add(n);
        }
      });
      newPolluted.forEach(i => game.cells[i].polluted = true);
      game.cells.forEach(cell => { if (cell.type === "oyster" && cell.polluted && Math.random() < .45) cell.polluted = false; });
    }

    function storm() {
      const placed = game.cells.filter(c => c.type !== "empty");
      if (placed.length && Math.random() < .55) placed[Math.floor(Math.random()*placed.length)].type = "empty";
      game.water -= 8;
      game.log.unshift("风暴潮冲刷了修复区，部分设施受损。");
    }

    function finish() {
      game.ended = true;
      const s = scenes[currentSceneId];
      const pollution = game.cells.filter(c => c.polluted).length;
      const score = Math.round(game.water * .35 + game.larvae * .25 + game.bio * .35 + game.budget * .1 - pollution * 1.5);

      let win = score >= s.goalScore;
      if (s.goalPollutionMax !== undefined && pollution > s.goalPollutionMax) win = false;
      if (s.goalMinStats !== undefined) {
        if (game.water < s.goalMinStats || game.larvae < s.goalMinStats || game.bio < s.goalMinStats) win = false;
      }

      resultTitle.textContent = win ? "修复成功" : "修复仍需加力";
      resultText.textContent = s[win ? "winText" : "loseText"] + " 最终评分：" + score + "（水质" + Math.round(game.water) + "，幼体" + Math.round(game.larvae) + "，多样性" + Math.round(game.bio) + "，污染" + pollution + "格）。";
      overlay.classList.remove("hidden");
      render();
    }

    function clamp(v) { return Math.max(0, Math.min(100, v)); }

    document.querySelectorAll("[data-tool]").forEach(btn => btn.onclick = () => { tool = btn.dataset.tool; render(); });
    document.querySelector("#nextBtn").onclick = nextTurn;
    document.querySelector("#restartBtn").onclick = fresh;
    document.querySelector("#againBtn").onclick = fresh;
    document.querySelector("#switchSceneBtn").onclick = showSceneSelect;
    document.querySelector("#startSceneBtn").onclick = () => startGameWithScene(selectedSceneId);
    document.querySelector("#editorCancelBtn").onclick = closeSandboxEditor;
    document.querySelector("#editorSaveBtn").onclick = saveAndStartSandbox;

    sceneInfoEl.textContent = `当前场景：${scenes[currentSceneId].name}`;
    showSceneSelect();
  </script>
</body>
</html>
