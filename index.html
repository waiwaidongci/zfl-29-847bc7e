<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潮间带生态修复</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <header>
    <div>
      <h1>潮间带生态修复</h1>
      <div>放置设施，控制污染，撑过潮汐周期。<span class="scene-info" id="sceneInfo"></span></div>
    </div>
    <div class="header-right">
      <button id="switchSceneBtn" class="secondary">切换场景</button>
      <button id="restartBtn">新开一局</button>
    </div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>设施</h2>
      <div class="tools">
        <button data-tool="oyster" class="active">牡蛎礁 - 12预算</button>
        <button data-tool="grass">海草床 - 10预算</button>
        <button data-tool="pile">围护桩 - 8预算</button>
        <button data-tool="erase" class="secondary">移除设施</button>
      </div>
      <p>牡蛎礁提升水质，海草床提升多样性，围护桩减缓污染扩散。</p>
      <button id="nextBtn">推进潮汐</button>
    </aside>
    <section class="panel">
      <div class="grid" id="grid"></div>
    </section>
    <aside class="panel">
      <h2>生态指标</h2>
      <div class="stats">
        <div class="stat"><span>回合</span><strong id="turnText">1 / 10</strong></div>
        <div class="stat"><span>预算</span><strong id="budgetText">120</strong></div>
        <div class="stat"><span>水质</span><strong id="waterText">50</strong></div>
        <div class="stat"><span>幼体</span><strong id="larvaeText">20</strong></div>
        <div class="stat"><span>多样性</span><strong id="bioText">20</strong></div>
        <div class="stat"><span>污染</span><strong id="pollutionText">0</strong></div>
      </div>
      <h2>日志</h2>
      <div class="log" id="log"></div>
    </aside>
  </main>
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="againBtn">再修复一次</button>
    </div>
  </div>
  <div class="overlay" id="sceneOverlay">
    <div class="modal scene-modal">
      <h2>选择修复场景</h2>
      <p>不同场景拥有不同的初始条件、挑战难度和修复目标。</p>
      <div class="scene-list" id="sceneList"></div>
      <div style="text-align:right;">
        <button id="startSceneBtn">开始修复</button>
      </div>
    </div>
  </div>
  <div class="overlay hidden" id="editorOverlay">
    <div class="modal editor-modal">
      <h2>沙盒编辑器</h2>
      <p>自定义你的修复区地图和游戏参数。配置完成后保存并开始模拟。</p>
      <div class="editor-container">
        <div class="editor-tools" id="editorTools">
          <button data-edit="pollute" class="active">设置污染格</button>
          <button data-edit="unpollute">清除污染格</button>
          <button data-edit="oyster">初始：牡蛎礁 - 12</button>
          <button data-edit="grass">初始：海草床 - 10</button>
          <button data-edit="pile">初始：围护桩 - 8</button>
          <button data-edit="erase" class="secondary">清除设施</button>
          <button data-edit="clearAll" class="secondary">清空全部</button>
        </div>
        <div>
          <div class="editor-grid" id="editorGrid"></div>
        </div>
        <div class="editor-params">
          <div>
            <label>初始预算</label>
            <input type="number" id="paramBudget" value="120" min="0" step="10">
            <div class="param-help">建议范围：50 - 300</div>
          </div>
          <div>
            <label>回合上限</label>
            <input type="number" id="paramTurns" value="10" min="1" max="30">
            <div class="param-help">建议范围：5 - 20</div>
          </div>
          <div>
            <label>风暴概率</label>
            <input type="number" id="paramStorm" value="0.20" min="0" max="1" step="0.05">
            <div class="param-help">范围：0 - 1（如 0.2 表示20%）</div>
          </div>
          <div>
            <label>目标评分</label>
            <input type="number" id="paramGoal" value="50" min="0" step="5">
            <div class="param-help">达成此评分即修复成功</div>
          </div>
          <div class="editor-preview">
            <h4>配置预览</h4>
            <div class="preview-item"><span>污染格数</span><span id="previewPollution">0</span></div>
            <div class="preview-item"><span>可修复区域</span><span id="previewRepairable">96</span></div>
            <div class="preview-item"><span>初始设施</span><span id="previewFacilities">0</span></div>
            <div class="preview-item"><span>初始设施花费</span><span id="previewCost">0</span></div>
          </div>
          <div class="error-tip" id="editorError"></div>
        </div>
      </div>
      <div class="editor-actions">
        <button id="editorCancelBtn" class="secondary">取消</button>
        <button id="editorSaveBtn">保存并开始</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
